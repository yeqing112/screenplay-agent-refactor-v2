name: Production regression

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
    branches: [main, master, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-regression:
    name: Deterministic production gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Regression fixtures use deterministic compiler paths.  This sentinel
      # prevents CI from accidentally invoking a paid external model.
      OPENAI_API_KEY: ci-no-external-llm
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace dependencies
        run: npm --prefix web ci

      - name: Run production regression gate
        id: production_gate
        run: npm run check:production

      - name: Upload production gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-regression-evidence-${{ github.run_id }}
          path: |
            artifacts/**
            web/dist/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish production gate summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production regression"
            echo "- Gate outcome: ${{ steps.production_gate.outcome }}"
            echo "- Python deterministic tests, Golden fixtures, runtime configuration, and frontend build are recorded in the uploaded artifact."
            echo "- External LLM/provider calls are disabled in this Required CI workflow."
          } >> "$GITHUB_STEP_SUMMARY"
