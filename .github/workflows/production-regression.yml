name: Production regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-regression:
    name: Prompt, workspace, and real-sample gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Regression fixtures use deterministic compiler paths.  This sentinel
      # prevents CI from accidentally invoking a paid external model.
      OPENAI_API_KEY: ci-no-external-llm
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace dependencies
        run: npm --prefix web ci

      - name: Run production regression gate
        run: npm run check:production
