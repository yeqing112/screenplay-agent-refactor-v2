name: Storyboard real LLM gray

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_REAL_LLM_GRAY to authorize billable calls"
        required: true
        default: "NO"
      targets:
        description: "Comma-separated book:episode:shot targets"
        required: true
        default: "990301:1:1,990301:1:2,990301:1:3"
      shot_count:
        description: "Maximum number of samples"
        required: true
        default: "3"
  schedule:
    # Scheduled runs remain disabled unless the repository variable
    # ENABLE_REAL_LLM_NIGHTLY is explicitly set to true.
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  real-llm-gray:
    name: Confirmed MiMo clone-only gray
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_REAL_LLM_GRAY') ||
      (github.event_name == 'schedule' && vars.ENABLE_REAL_LLM_NIGHTLY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: real-llm-gray
    env:
      OPENAI_API_KEY: ${{ secrets.MIMO_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.MIMO_BASE_URL || 'https://api.xiaomimimo.com/v1' }}
      LLM_MODEL: ${{ vars.MIMO_MODEL || 'mimo-v2.5' }}
      PYTHONIOENCODING: utf-8
      STORYBOARD_REAL_LLM_GRAY_RUN: "1"
      STORYBOARD_REAL_LLM_GRAY_USE_REAL_LLM: "1"
      STORYBOARD_REAL_LLM_GRAY_TARGETS: ${{ inputs.targets || '990301:1:1,990301:1:2,990301:1:3' }}
      STORYBOARD_REAL_LLM_GRAY_SHOT_COUNT: ${{ inputs.shot_count || '3' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify explicit gray authorization
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "MIMO_API_KEY is not configured"; exit 1; }
          test "$STORYBOARD_REAL_LLM_GRAY_RUN" = "1"
          test "$STORYBOARD_REAL_LLM_GRAY_USE_REAL_LLM" = "1"

      - name: Seed evidence-complete gray sample
        run: python scripts/seed-storyboard-gray-sample.py 990301

      - name: Run clone-only real LLM gray
        run: python scripts/validate-storyboard-real-llm-gray.py

      - name: Upload gray reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-real-llm-gray-${{ github.run_id }}
          path: artifacts/storyboard-real-llm-gray-*
          if-no-files-found: warn
